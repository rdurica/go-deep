name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Formátování
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Tyhle soubory nejsou naformátované:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Referenční řešení
        run: make solutions

      - name: Referenční řešení s detektorem závodů
        run: |
          for d in lessons/lesson-*/solutions; do
            go test -race -count=1 "./$d/..." || exit 1
          done

      - name: Projekty
        run: go test -race -count=1 ./projects/...

      - name: Stuby cvičení musí padat
        run: |
          for d in lessons/lesson-*/exercise; do
            if go test -count=1 -timeout 5s "./$d/" >/dev/null 2>&1; then
              echo "$d prochází, ale má padat na nedokončeném TODO"
              exit 1
            fi
          done

      - name: Index je aktuální
        run: |
          python3 scripts/generate_index.py
          git diff --exit-code BOOK.md PROGRESS.md
